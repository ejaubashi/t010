# Il servizio e il disco persistente sono a pagamento.
# Render mostra i costi da approvare prima della creazione.
services:
  - type: web
    name: tavola
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: false
    disk:
      name: tavola-data
      mountPath: /var/data/tavola
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.14.0
      - key: NODE_ENV
        value: production
      - key: TAVOLA_DATA_DIR
        value: /var/data/tavola
      - key: TAVOLA_ACCESS_PASSWORD
        sync: false
